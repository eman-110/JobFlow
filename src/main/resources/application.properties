spring.application.name=${JOBFLOW_APP_NAME:JobFlow}
app.name=${JOBFLOW_APP_NAME:JobFlow}
app.version=${JOBFLOW_APP_VERSION:1.0.0}
app.environment=${JOBFLOW_ENVIRONMENT:development}

jobflow.name=${JOBFLOW_APP_NAME:JobFlow}
jobflow.version=${JOBFLOW_APP_VERSION:1.0.0}
jobflow.environment=${JOBFLOW_ENVIRONMENT:development}
jobflow.notifications.enabled=${JOBFLOW_NOTIFICATIONS_ENABLED:true}
jobflow.max-jobs=${JOBFLOW_MAX_JOBS:100}
jobflow.minimum-salary=${JOBFLOW_MINIMUM_SALARY:100000}
app.minimum-salary=${JOBFLOW_MINIMUM_SALARY:100000}

spring.profiles.active=${JOBFLOW_PROFILE:dev}

jobflow.jwt.secret=${JWT_SECRET:}
jobflow.jwt.issuer=${JWT_ISSUER:jobflow}
jobflow.jwt.audience=${JWT_AUDIENCE:jobflow-api}
jobflow.jwt.access-token-minutes=${JWT_ACCESS_TOKEN_MINUTES:15}
jobflow.jwt.refresh-token-days=${JWT_REFRESH_TOKEN_DAYS:7}
jobflow.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
jobflow.security.rate-limit.login=${AUTH_LOGIN_RATE_LIMIT:10}
jobflow.security.rate-limit.registration=${AUTH_REGISTRATION_RATE_LIMIT:5}
jobflow.security.rate-limit.refresh=${AUTH_REFRESH_RATE_LIMIT:30}
