spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/jobflow_dev?serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:jobflow_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
jobflow.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
