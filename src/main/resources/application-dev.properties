app.environment=development
jobflow.environment=development
jobflow.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
logging.level.com.jobflow=DEBUG
logging.file.name=logs/jobflow.log
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration,org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration
jobflow.security.user.username=${JOBFLOW_DEV_USER_USERNAME:jobseeker@jobflow.local}
jobflow.security.user.password=${JOBFLOW_DEV_USER_PASSWORD:dev-user-password}
jobflow.security.recruiter.username=${JOBFLOW_DEV_RECRUITER_USERNAME:recruiter@jobflow.local}
jobflow.security.recruiter.password=${JOBFLOW_DEV_RECRUITER_PASSWORD:dev-recruiter-password}
jobflow.security.admin.username=${JOBFLOW_DEV_ADMIN_USERNAME:admin@jobflow.local}
jobflow.security.admin.password=${JOBFLOW_DEV_ADMIN_PASSWORD:dev-admin-password}
