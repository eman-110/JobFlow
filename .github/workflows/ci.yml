name: JobFlow CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Verify Docker is available
        run: docker info

      - name: Show resolved Testcontainers Docker client versions
        run: bash ./mvnw --batch-mode dependency:tree -Dscope=test '-Dincludes=org.testcontainers:*,com.github.docker-java:*'

      - name: Build and test
        run: bash ./mvnw --batch-mode clean verify

      - name: Require all MySQL integration tests to run
        run: |
          python3 - <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path("target/surefire-reports/TEST-com.jobflow.persistence.repository.JobJpaRepositoryIntegrationTest.xml")
          if not report.is_file():
              sys.exit(f"Missing integration-test report: {report}")

          suite = ET.parse(report).getroot()
          counts = {
              name: int(suite.attrib.get(name, "0"))
              for name in ("tests", "skipped", "failures", "errors")
          }
          print(f"MySQL integration tests: {counts}")
          if counts != {"tests": 27, "skipped": 0, "failures": 0, "errors": 0}:
              sys.exit("Expected all 27 MySQL integration tests to pass without skips.")
          PY
