name: JobFlow CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Verify Docker is available
        run: docker info

      - name: Show resolved Testcontainers Docker client versions
        run: bash ./mvnw --batch-mode dependency:tree -Dscope=test '-Dincludes=org.testcontainers:*,com.github.docker-java:*'

      - name: Build and test
        run: bash ./mvnw --batch-mode clean verify

      - name: Require all MySQL integration tests to run
        run: |
          python3 - <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path("target/surefire-reports/TEST-com.jobflow.persistence.repository.JobJpaRepositoryIntegrationTest.xml")
          if not report.is_file():
              sys.exit(f"Missing integration-test report: {report}")

          suite = ET.parse(report).getroot()
          counts = {
              name: int(suite.attrib.get(name, "0"))
              for name in ("tests", "skipped", "failures", "errors")
          }
          print(f"MySQL integration tests: {counts}")
          if counts != {"tests": 42, "skipped": 0, "failures": 0, "errors": 0}:
              sys.exit("Expected all 42 MySQL integration tests to pass without skips.")
          PY

      - name: Upload Maven reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maven-reports-${{ github.run_id }}
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
            target/jacoco.exec
          if-no-files-found: warn
          retention-days: 7
